name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualstack-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run QualStack lint
        run: python3 bin/qualstack-lint
      - name: Run QualStack script tests
        run: python3 tests/run_tests.py

  plugin-validate:
    # Best-effort: `claude plugin validate` catches frontmatter/schema issues,
    # but the CLI is installed fresh here, so don't let its availability
    # break CI for contributors.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin manifest and skills
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict

  r-tools:
    # The R tools (clue, case, trace, and model-check functions) against numbers
    # published in Integrated Inferences. Best-effort: CRAN binaries can lag.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install CausalQueries
        run: Rscript -e 'install.packages(c("CausalQueries", "here"))'
      - name: Check the R tools against the book
        run: Rscript tests/r/verify-book.R .
